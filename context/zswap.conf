# Compressed RAM cache in front of /dev/sda5: swapped-out pages are compressed
# into a pool in RAM, and the coldest are written back to the SSD when the pool
# fills or (shrinker) under memory pressure. Does nothing without a swap device.
# zswap.* are module parameters of built-in code; tmpfiles keeps boot.txt alone.
# zstd (CONFIG_CRYPTO_ZSTD=m, autoloaded): best ratio, ~3x slower than lz4.
w /sys/module/zswap/parameters/compressor - - - - zstd
w /sys/module/zswap/parameters/shrinker_enabled - - - - Y
w /sys/module/zswap/parameters/enabled - - - - Y
