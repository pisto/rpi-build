# `install /bin/false` rather than `blacklist`: these bind by bus match, not by module alias.

# Bluetooth: hci_uart_bcm owns BT_REG_ON, so an unbound driver leaves the core powered down.
install hci_uart /bin/false
install btbcm    /bin/false

# WiFi: this only skips the firmware load, rpi-wifi-poweroff.service does the actual power down.
install brcmfmac     /bin/false
install brcmfmac_wcc /bin/false
