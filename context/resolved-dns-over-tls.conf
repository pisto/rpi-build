# With DHCP-provided DNS ignored (see 10-eth0.network's UseDNS=no) and no
# DNS= set here, resolved falls back to its own compiled-in default servers
# (Quad9/Cloudflare/Google, visible as "Fallback DNS Servers" in `resolvectl
# status`) instead of whatever the local network's DHCP server hands out.
# Those fallback entries already carry the hostnames DNS-over-TLS needs for
# certificate validation, so just turning DNSOverTLS on is enough to use it.
[Resolve]
DNSOverTLS=yes
