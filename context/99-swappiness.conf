# Swap is /dev/sda5 behind zswap (see zswap.conf): most swap-outs only
# compress into RAM, so reclaim may swap anonymous memory about as readily as
# it drops page cache. Not higher: once the pool spills, the SSD sees the same
# eagerness.
vm.swappiness=100
# Swap-in readahead (2^n pages): pages coming from the zswap pool would be
# wasted decompressions, and the SSD has no seek cost to amortize.
vm.page-cluster=0
